# Weekly FPL brief.
#
# This repository is public, so every line of this log is public. Steps log
# status codes, byte counts and record counts only. No step prints the
# contents of brief.md, data/*.json or state/overrides.md (which is
# gitignored and never present here anyway).
#
# Third-party actions are pinned to commit SHAs; the version comment is
# informational only.

name: brief

on:
  schedule:
    - cron: "0 7 * * 5" # Friday 07:00 UTC
  workflow_dispatch:
    inputs:
      skip_gate:
        description: "Write and commit brief.md even if the gate is closed (test runs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    name: fetch, gate, digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --quiet --requirement requirements.txt

      # `make ci-brief` is the same pipeline as `make brief` minus the final
      # print. It writes the gate's JSON to data/gate.json and stops there,
      # exit 0, when there is no brief to write this week.
      - name: Fetch, gate, digest (make ci-brief; writes brief.md, prints nothing)
        env:
          SKIP_GATE: ${{ inputs.skip_gate == true && '1' || '' }}
        run: make ci-brief SKIP_GATE="$SKIP_GATE"

      - name: Read the gate
        id: gate
        env:
          SKIP_GATE: ${{ inputs.skip_gate == true && '1' || '' }}
        run: |
          if grep -q '"proceed": true' data/gate.json || [ -n "$SKIP_GATE" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Gate closed: no brief this week. Stopping without a commit."
          fi

      - name: Upload brief.md for the commit job
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brief
          path: brief.md
          if-no-files-found: error
          retention-days: 1

  # Commits to the branch the workflow ran on: main for the Friday schedule,
  # or whichever branch you picked when dispatching it by hand.
  commit:
    name: commit brief.md
    needs: build
    if: needs.build.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the run's branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download brief.md
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brief
          path: .

      - name: Commit brief.md if it changed
        run: |
          git add brief.md
          if git diff --cached --quiet; then
            echo "brief.md unchanged; nothing to commit."
            exit 0
          fi
          # GitHub's public Actions bot identity, assembled here so the
          # repository contains no literal email address.
          bot="github-actions[bot]"
          git config user.name "$bot"
          git config user.email "41898282+${bot}@users.noreply.github.com"
          git commit --quiet --message "brief: update for $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed brief.md ($(wc -c < brief.md) bytes)"
